name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build server
        run: |
          cmake -S server -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Integration test (M1 connection layer)
        run: python3 tools/test_m1.py --server build/cppgameserver

      - name: Unit test (simulation)
        run: ctest --test-dir build --output-on-failure

      - name: Integration test (M2 protocol)
        run: python3 tools/test_m2.py --server build/cppgameserver

      - name: Integration test (M3 movement)
        run: python3 tools/test_m3.py --server build/cppgameserver

      - name: Generated C# is up to date
        run: |
          cmake --build build --target gen_proto_csharp
          git diff --exit-code -- client-unity/Assets/Scripts/Generated

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build client logic tests (.NET)
        run: dotnet build tools/client-tests -c Release

      - name: Client logic (unit)
        run: dotnet tools/client-tests/bin/Release/net8.0/ClientTests.dll unit

      - name: Client logic (end-to-end with the server)
        run: |
          set +e
          ./build/cppgameserver 17900 10 &
          SERVER=$!
          sleep 1
          dotnet tools/client-tests/bin/Release/net8.0/ClientTests.dll e2e 17900
          STATUS=$?
          kill -INT $SERVER
          wait $SERVER
          exit $STATUS

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build server (MSVC)
        run: |
          cmake -S server -B build
          cmake --build build --config Release --parallel

      - name: Integration test (M1 connection layer)
        run: python tools/test_m1.py --server build/Release/cppgameserver.exe

      - name: Unit test (simulation)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Integration test (M2 protocol)
        run: python tools/test_m2.py --server build/Release/cppgameserver.exe

      - name: Integration test (M3 movement)
        run: python tools/test_m3.py --server build/Release/cppgameserver.exe

      - name: Build IOCP echo sample (MSVC)
        run: |
          cmake -S samples/iocp-echo -B build-iocp
          cmake --build build-iocp --config Release

      - name: IOCP echo sample test
        run: python samples/iocp-echo/test_echo.py --exe build-iocp/Release/iocp_echo.exe
